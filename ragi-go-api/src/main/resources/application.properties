server.port=${PORT:8080}


# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:your-telegram-token}
telegram.admin.chatId=${TELEGRAM_ADMIN_CHAT_ID:1911247574,5880756540}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=raagigo@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:your-gmail-password}

# Gmail API Configuration
app.gmail.client-id=${GMAIL_CLIENT_ID:your-client-id}
app.gmail.client-secret=${GMAIL_CLIENT_SECRET:your-client-secret}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-jwt-secret}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://ragi-go.web.app,https://ragi-go.firebaseapp.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
