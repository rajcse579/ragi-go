server.port=${PORT:8080}


# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:your-telegram-token}
telegram.admin.chatId=${TELEGRAM_ADMIN_CHAT_ID:1911247574,5880756540}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:raagigo@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-gmail-password}


# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-jwt-secret-must-be-at-least-32-characters-long-so-it-doesnt-fail}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://ragi-go.web.app,https://ragi-go.firebaseapp.com,http://localhost,capacitor://localhost,https://localhost}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
